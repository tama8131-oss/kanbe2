type: よくある質問
title: 車がなくても始められる？
lines:
  - text: "よくある質問。車を持っていなくても、配送の仕事は始められる？"
  - text: "答えは、会社の車を借りて始める方法があります。"
  - text: "ただし、車を借りるのにもお金がかかります。"
  - text: "浜松で、会社の車を借りる場合の例です。車代と最上位の保険で、月7万6,000円。"
    table:
      title: "毎月かかるお金"
      rows:
        - ["車代＋最上位の保険", "月7万6,000円"]
        - ["ガソリン代", "月約3万円"]
      note: "※浜松・会社の車を借りる場合の例"
      highlight_last: false
  - text: "ガソリン代は、月約3万円です。"
    table:
      title: "毎月かかるお金"
      rows:
        - ["車代＋最上位の保険", "月7万6,000円"]
        - ["ガソリン代", "月約3万円"]
      note: "※浜松・会社の車を借りる場合の例"
      highlight_last: false
  - text: "車がなくても始められる。でも、この費用がかかることは知っておいてください。"
caption: |
  【車がなくても始められる？】
  Amazon配送の仕事は、自分の車がなくても、会社の車を借りて始める方法があります。
  ただし車代やガソリン代はかかります。浜松の例を数字で紹介しました。

  いまは関東エリアだけで募集しています。
  くわしい条件はプロフィールの固定投稿へ。

