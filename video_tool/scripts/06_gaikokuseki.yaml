type: よくある質問
title: 外国籍でも働ける？
lines:
  - text: "外国籍でも、配送の仕事はできる？"
  - text: "答えは、外国籍もOKです。"
  - text: "ただし、個人事業主として働けるビザがある人に限ります。"
    yomi: "ただし、個人じぎょうぬしとして働けるビザがある人に限ります。"
  - text: "自分のビザで個人事業主として働けるか、先に確認してください。"
    yomi: "自分のビザで個人じぎょうぬしとして働けるか、先に確認してください。"
  - text: "経験ゼロでOK。車は貸してもらえます。"
  - text: "気になる人は、DMで相談してください。"
