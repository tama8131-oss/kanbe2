type: 正直なデメリット
title: 業務委託って、どういうこと？
lines:
  - text: "配送の仕事でよく聞く「業務委託」って、どういうこと？"
  - text: "会社に雇われる社員ではありません。"
  - text: "個人事業主として、仕事を受けて働く形です。"
    yomi: "個人じぎょうぬしとして、仕事を受けて働く形です。"
  - text: "だから、上司も同僚もいない。ひとりで黙々と働けます。"
  - text: "そのかわり、確定申告などの手続きは自分で行います。"
  - text: "車を借りる場合は、車代とガソリン代も毎月かかります。"
  - text: "保存して、ほかの働き方と比べてみてください。"
caption: |
  配送の仕事でよく聞く「業務委託」って、どういうこと？

  会社に雇われる社員ではなく、個人事業主として仕事を受けて働く形です。

  ⭕ 上司も同僚もいない、ひとりで黙々と働ける
  ⚠️ 確定申告などの手続きは自分で行う
  ⚠️ 車を借りる場合は、車代とガソリン代が毎月かかる

  いいことだけじゃなく、正直に伝えます。

  全国対応OK！
  基本は関東エリアの情報です。

  🔖 ほかの働き方と比べるときのために保存がおすすめです
  📌 くわしい条件はプロフィールのリンクへ
  💬 コメントに「相談」と書いてくれたら、DMで条件を送ります

