# 型：よくある質問
type: よくある質問
title: 外国籍でも働ける？
lines:
  - text: "よくある質問。外国籍でも、配送の仕事はできる？"
  - text: "答えは、外国籍もOKです。"
  - text: "ただし、個人事業主として働けるビザがある人に限ります。"
    yomi: "ただし、個人じぎょうぬしとして働けるビザがある人に限ります。"
  - text: "自分のビザで個人事業主として働けるか、先に確認しておきましょう。"
    yomi: "自分のビザで個人じぎょうぬしとして働けるか、先に確認しておきましょう。"
  - text: "経験ゼロでOK。気になる人は、DMで相談してください。"
caption: |
  【外国籍でも働ける？】
  Amazon配送の仕事は、外国籍もOKです。
  ただし、個人事業主として働けるビザがある人に限ります。
  経験ゼロでOKです。

  全国対応OK！
  基本は関東エリアの情報です。
