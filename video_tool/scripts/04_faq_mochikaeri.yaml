title: 借りた車は持ち帰れる？
lines:
  - text: "よくある質問。借りた車は、持ち帰れる？"
  - text: "答えは、車レンタルは持ち帰れます。"
  - text: "車を持っていなくても、車は貸してもらえます。"
  - text: "ただし、お金はかかります。関東の例で、車代と最上位の保険で月7万6,000円。"
    table:
      title: "毎月かかるお金"
      rows:
        - ["車代＋最上位の保険", "月7万6,000円"]
        - ["ガソリン代", "月約3万円"]
      note: "※関東・会社の車を借りる場合の例"
      highlight_last: false
  - text: "ガソリン代は、月約3万円です。"
    table:
      title: "毎月かかるお金"
      rows:
        - ["車代＋最上位の保険", "月7万6,000円"]
        - ["ガソリン代", "月約3万円"]
      note: "※関東・会社の車を借りる場合の例"
      highlight_last: false
  - text: "気になる人は、DMで相談してください。"
caption: |
  【借りた車は持ち帰れる？】
  Amazon配送の仕事は、車がなくても貸してもらえて、車レンタルは持ち帰れます。
  ただし車代やガソリン代はかかります。関東の例を数字で紹介しました。

