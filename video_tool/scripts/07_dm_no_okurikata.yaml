# ファネル：⑥商談（「質問に答えます」シリーズ4：DMの送り方）／CTA：DM
type: よくある質問
title: DMって、どう送ればいいの？
lines:
  - label: "質問に答えます"
    text: "相談したいけど、DMってどう送ればいいの？"
  - label: "手順1"
    text: "はこぶのプロフィールを開いて、「メッセージ」を押す。"
    yomi: "ハコブのプロフィールを開いて、「メッセージ」を押す。"
  - label: "手順2"
    text: "「相談したい」とだけ送る。"
  - label: "手順3"
    text: "住んでいる地域、車を持っているか、いつごろから働きたいか。3つに答える。"
  - text: "それだけで、くわしい条件を案内します。"
  - text: "質問だけでも大丈夫。気軽にDMしてください。"
caption: |
  相談したいけど、DMってどう送ればいいの？

  1️⃣ はこぶのプロフィールを開いて、「メッセージ」を押す
  2️⃣ 「相談したい」とだけ送る
  3️⃣ 住んでいる地域、車を持っているか、いつごろから働きたいか、の3つに答える

  それだけで、くわしい条件を案内します。
  質問だけでも大丈夫です。

  全国対応OK！
  基本は関東エリアの情報です。

  💬 DMで「相談したい」と送ってください
  📌 くわしい条件はプロフィールのリンクへ

