title: 借りた車、持ち帰れるって知ってた？
lines:
  - text: "借りた車、持ち帰れるって知ってた？"
  - text: "車を持っていなくても、車は貸してもらえます。"
  - text: "そして、車レンタルは持ち帰れます。"
  - text: "ただし、タダではありません。車代とガソリン代はかかります。"
  - text: "かかるお金は、プロフィールの固定投稿にまとめています。"
caption: |
  借りた車、持ち帰れるって知ってた？

  Amazon配送の仕事は、車を持っていなくても車を貸してもらえて、車レンタルは持ち帰れます。
  ただし、車代とガソリン代はかかります。

  全国対応OK！
