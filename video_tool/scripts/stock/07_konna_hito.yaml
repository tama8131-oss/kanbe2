# 型：よくある質問（こんな人に）
type: よくある質問
title: こんな人に知ってほしい
lines:
  - text: "こんな人に、配送の仕事を知ってほしい。"
  - label: "1"
    text: "職場の人間関係に疲れた人。上司も同僚もいない、ひとりで黙々です。"
  - label: "2"
    text: "経験がなくて不安な人。経験ゼロでOKです。"
  - label: "3"
    text: "車を持っていない人。車は貸してもらえます。"
  - label: "4"
    text: "外国籍の人。個人事業主として働けるビザがあればOKです。"
    yomi: "外国籍の人。個人じぎょうぬしとして働けるビザがあればOKです。"
  - text: "ひとつでも当てはまったら、プロフィールの固定投稿へ。"
caption: |
  こんな人に、配送の仕事を知ってほしい。

  1️⃣ 職場の人間関係に疲れた人（上司も同僚もいない、ひとりで黙々）
  2️⃣ 経験がなくて不安な人（経験ゼロでOK）
  3️⃣ 車を持っていない人（車は貸してもらえる）
  4️⃣ 外国籍の人（個人事業主として働けるビザがある人）

  全国対応OK！
  基本は関東エリアの情報です。

  📌 くわしい条件はプロフィールの固定投稿へ
  💬 DMで「相談したい」と送ってください
  🔖 あとで見返せるように保存がおすすめです

