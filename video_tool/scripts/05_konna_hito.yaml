# 型：よくある質問（まとめ）
type: よくある質問
title: こんな人に知ってほしい
lines:
  - text: "配送の仕事、こんな人に知ってほしい。"
  - text: "職場の人間関係に疲れた人。上司も同僚もいない、ひとりで黙々です。"
  - text: "経験がなくて不安な人。経験ゼロでOKです。"
  - text: "車を持っていない人。車は貸してもらえます。"
  - text: "外国籍の人も、個人事業主として働けるビザがあればOKです。"
    yomi: "外国籍の人も、個人じぎょうぬしとして働けるビザがあればOKです。"
  - text: "くわしくは、プロフィールの固定投稿へ。"
caption: |
  【こんな人に知ってほしい】
  ✅ 職場の人間関係に疲れた人（上司も同僚もいない、ひとりで黙々）
  ✅ 経験がなくて不安な人（経験ゼロでOK）
  ✅ 車を持っていない人（車は貸してもらえる）
  ✅ 外国籍の人（個人事業主として働けるビザがある人）

  全国対応OK！
  基本は関東エリアの情報です。
  くわしい条件はプロフィールの固定投稿へ。
  気になる人はDMで「相談したい」と送ってください。

