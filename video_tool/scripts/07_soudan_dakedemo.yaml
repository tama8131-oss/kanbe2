caption: |
  相談したら、絶対に始めないといけないの？

  そんなことはありません。質問だけでも大丈夫です。
  まずは、3つだけ教えてください。

  1️⃣ 住んでいる地域
  2️⃣ 車を持っているか（持っていなくても、車は貸してもらえます）
  3️⃣ いつごろから働きたいか

  わかったら、くわしい条件を案内します。
  条件を聞いてから、ゆっくり決めてください。

  全国対応OK！
  基本は関東エリアの情報です。

  💬 DMで「相談したい」と送ってください
  📌 くわしい条件はプロフィールのリンクへ

