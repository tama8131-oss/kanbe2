# ファネル：④顧客比較（始める前のチェックリスト）／CTA：保存
type: よくある質問
title: 始める前に確認しておくこと3つ
lines:
  - text: "配送の仕事を始める前に、確認しておくこと3つ。"
  - label: "確認1"
    text: "車を持っているか。持っていなくても、車は貸してもらえます。"
  - label: "確認2"
    text: "毎月のお金。車を借りると、車代とガソリン代がかかります。"
  - label: "確認3"
    text: "外国籍の人は、個人事業主として働けるビザがあるか。"
    yomi: "外国籍の人は、個人じぎょうぬしとして働けるビザがあるか。"
  - text: "3つともOKなら、経験ゼロでも始められます。"
  - text: "保存して、あとで見返してください。"
caption: |
  配送の仕事を始める前に、確認しておくこと3つ。

  ✅ 車を持っているか（持っていなくても、車は貸してもらえます）
  ✅ 毎月のお金（車を借りると、車代とガソリン代がかかります）
  ✅ 外国籍の人は、個人事業主として働けるビザがあるか

  3つともOKなら、経験ゼロでも始められます。

  全国対応OK！
