caption: |
  配送の仕事の相談って、何を聞かれるの？

  DMで「相談したい」と送るだけで大丈夫です。
  聞くのはこの3つだけ。

  1️⃣ 住んでいる地域
  2️⃣ 車を持っているか（持っていなくても、車は貸してもらえます）
  3️⃣ いつごろから働きたいか

  わかったら、くわしい条件を案内します。
  質問だけでも大丈夫です。

  全国対応OK！
  基本は関東エリアの情報です。

  💬 DMで「相談したい」と送ってください
