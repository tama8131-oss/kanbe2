title: 相談って何を聞かれるの？
lines:
  - text: "配送の仕事の相談って、何を聞かれるの？"
  - text: "DMで「相談したい」と送るだけで大丈夫です。"
  - label: "聞くこと1"
    text: "住んでいる地域。"
  - label: "聞くこと2"
