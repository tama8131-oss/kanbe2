title: ひとりで働きたい人にすすめる3つの理由
lines:
  - text: "ひとりで働きたい人に、配送の仕事をすすめる3つの理由。"
  - label: "理由1"
    text: "上司も同僚もいない。ひとりで黙々と働けます。"
  - label: "理由2"
    text: "経験ゼロでOK。未経験から始められます。"
  - label: "理由3"
    text: "車がなくても、車は貸してもらえます。"
  - text: "ひとつでも気になったら、プロフィールの固定投稿へ。"
caption: |
